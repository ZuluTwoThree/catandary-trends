  - key: inclusive_and_human_centric_design
    name_en: "Inclusive & Human-Centric Design"
    name_de: "Inklusives & Menschenzentriertes Design"
    description: "Universal accessibility, assistive technology, gender-inclusive products, aging-population design, neurodiversity accommodation, equity in design."
    horizon: "15-25 years"
    verticals: [DESIGN, SOCIAL, HEALTH, TECH, FASHION]

  - key: future_of_food_and_agriculture
    name_en: "Future of Food & Agriculture"
    name_de: "Zukunft der Ernährung & Landwirtschaft"
    description: "Alternative proteins, precision agriculture, vertical farming, functional/fortified foods, food-as-medicine, novel ingredients."
