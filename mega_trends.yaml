# Catandary Mega-Trends Taxonomy
# Generated: 2026-04-04
#
# momentum: rising | stable | declining | emerging (data-driven, from temporal signal analysis)
# cluster_strength: strong | moderate | fragmented (from embedding clustering analysis)
