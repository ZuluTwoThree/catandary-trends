# Catandary Mega-Trends Taxonomy
# Canonical list of mega-trends (10-25 year horizon).
# Used by the classification prompt (Qwen3 8B picks from this list)
# and the mega-trend reviewer (Qwen3 14B validates/proposes updates monthly).
#
# Each mega-trend has:
#   key: snake_case identifier stored in DB
#   name_en / name_de: display names
#   description: one-line definition for LLM prompt context
#   horizon: estimated time horizon
#   verticals: most relevant verticals (not exclusive — cross-vertical assignment is encouraged)

mega_trends:

  - key: artificial_intelligence_and_automation
    name_en: "Artificial Intelligence & Automation"
    name_de: "Künstliche Intelligenz & Automatisierung"
    description: "AI/ML integration across industries — from generative AI and design tools to industrial robotics, autonomous systems, and AI-driven decision making."
    horizon: "15-25 years"
    verticals: [TECH, BIZ, HEALTH, FOOD, DESIGN, CULTURE]

  - key: circular_economy_and_zero_waste
    name_en: "Circular Economy & Zero Waste"
    name_de: "Kreislaufwirtschaft & Zero Waste"
    description: "Closed-loop production systems, waste elimination, recyclability-by-design, reversible architecture, product-as-service models."
    horizon: "15-25 years"
    verticals: [ECO, DESIGN, FASHION, FOOD, BIZ]

  - key: personalized_health_and_longevity
    name_en: "Personalized Health & Longevity"
    name_de: "Personalisierte Gesundheit & Langlebigkeit"
    description: "Precision medicine, digital therapeutics, individualized nutrition, longevity science, biomarker-driven health optimization."
    horizon: "15-25 years"
    verticals: [HEALTH, TECH, FOOD, FASHION]

  - key: climate_resilience_and_adaptation
    name_en: "Climate Resilience & Adaptation"
    name_de: "Klimaresilienz & Anpassung"
    description: "Designing systems, buildings, and communities for climate change impact — flood-resistant architecture, heat adaptation, climate-smart agriculture."
    horizon: "20-25 years"
    verticals: [ECO, DESIGN, FOOD, SOCIAL]

  - key: clean_energy_transition
    name_en: "Clean Energy Transition"
    name_de: "Saubere Energiewende"
    description: "Decarbonization of energy, industry and transport — renewables, green hydrogen, energy storage, grid modernization, carbon capture."
    horizon: "20-25 years"
    verticals: [ECO, TECH, BIZ, SOCIAL]

  - key: bio_revolution_and_new_materials
    name_en: "Bio-Revolution & New Materials"
    name_de: "Bio-Revolution & Neue Materialien"
    description: "Biotech-derived materials, synthetic biology, mycelium/algae/cellulose-based products, lab-grown alternatives, biomimicry."
    horizon: "15-25 years"
    verticals: [ECO, DESIGN, FASHION, FOOD, HEALTH]

  - key: connected_living_and_smart_spaces
    name_en: "Connected Living & Smart Spaces"
    name_de: "Vernetztes Wohnen & Intelligente Räume"
    description: "IoT ecosystems, smart homes/kitchens/offices, ambient computing, sensor-driven environments, home automation."
    horizon: "10-20 years"
    verticals: [TECH, DESIGN, FOOD, BIZ]

  - key: experience_economy_and_immersive_design
    name_en: "Experience Economy & Immersive Design"
    name_de: "Erlebnisökonomie & Immersives Design"
    description: "Physical spaces as experience platforms — immersive retail, experiential dining, sensory environments, projection mapping, pop-up culture."
    horizon: "10-20 years"
    verticals: [DESIGN, BIZ, CULTURE, LUXURY, FOOD]

  - key: cultural_heritage_and_identity
    name_en: "Cultural Heritage & Identity Renaissance"
    name_de: "Kulturelles Erbe & Identitätsrenaissance"
    description: "Revival of craft traditions, cultural fusion in design, place-based branding, indigenous knowledge integration, regional identity as differentiator."
