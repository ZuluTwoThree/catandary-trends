# Freely definable domains for two-stage pocket discovery (pipeline/domains.py).
#
# Stage 1 decides membership from the EMBEDDING, not from the vertical label the 8B /
# distill heads assign: a linear probe on the 1024-dim prefix, trained on seeds that do
# not come from our own classifiers. Stage 2 (pipeline/emerging_snapshot.py --scope
# domain:<key>) looks for pockets among the members only — 5G/6G inside "wireless",
# humanoid robots inside "robotics".
#
# Seeds (any subset; the more tiers they reach, the better the probe transfers):
#   cpc                 prefixes of examiner CPC codes (patent_cpc.cpc), e.g. H04W, B25J9
#   openalex_topics     exact OpenAlex topic names (research, via DOI)
#   openalex_subfields  OpenAlex subfields (research)
#   phrases             phrases searched in titles/summaries/tags, research abstracts and
#                       patent abstracts (websearch syntax, "quoted" = phrase) — the only
#                       seed that also reaches the trade press
# target_recall         share of each tier's seeds the member threshold keeps (default 0.7);
#                       the background false-positive rate is reported next to it
#
# Train / measure:   .venv/bin/python -m pipeline.domains train <key> | measure <key> | list
# Pockets:           .venv/bin/python -m pipeline.emerging_snapshot --scope domain:<key>

wireless:
  name: Wireless communication
  seeds:
    cpc: [H04W, H04B7, H01Q, H04L5, H04L27]
    openalex_topics:
      - Advanced MIMO Systems Optimization
      - Advanced Wireless Communication Techniques
      - Advanced Wireless Communication Technologies
      - Advanced Wireless Network Optimization
      - Bluetooth and Wireless Communication Technologies
      - Cognitive Radio Networks and Spectrum Sensing
      - Full-Duplex Wireless Communications
      - Millimeter-Wave Propagation and Modeling
      - Antenna Design and Analysis
    phrases: ['"5G"', '"6G"', '"wireless network"', '"radio access network"', '"Wi-Fi"',
              '"millimeter wave"', '"massive MIMO"', '"Open RAN"', '"spectrum auction"',
              '"cellular network"', '"satellite broadband"']
  target_recall: 0.7

robotics:
  name: Robotics
  seeds:
    cpc: [B25J, B62D57, B25H]
    openalex_topics:
      - Control and Dynamics of Mobile Robots
      - Modular Robots and Swarm Intelligence
      - Reinforcement Learning in Robotics
      - Robotic Locomotion and Control
      - Robotic Mechanisms and Dynamics
      - Robotic Path Planning Algorithms
      - Robotics and Automated Systems
      - Robotics and Sensor-Based Localization
      - Robot Manipulation and Learning
      - Soft Robotics and Applications
      - Social Robot Interaction and HRI
    phrases: ['"humanoid robot"', '"industrial robot"', '"collaborative robot"', '"robot arm"',
              '"legged robot"', '"robotic surgery"', '"warehouse robot"', '"exoskeleton"',
              '"autonomous mobile robot"', '"robotics"']
  target_recall: 0.7

electric_mobility:
  name: Electric mobility
  seeds:
    cpc: [B60L, B60K1, B60K6, H02J7, B60W20]
    openalex_topics:
      - Electric and Hybrid Vehicle Technologies
      - Electric Vehicles and Infrastructure
      - Advanced Battery Technologies Research
    phrases: ['"electric vehicle"', '"EV charging"', '"charging station"', '"battery electric"',
              '"plug-in hybrid"', '"electric truck"', '"electric bus"', '"e-mobility"',
              '"vehicle-to-grid"']
  target_recall: 0.7
