# Schwellen der Ops-Alarme (#104, Stufe 5). Gelesen von pipeline/ops_alerts.py
# nach jeder Messung des Samplers; Aenderungen hier wirken beim naechsten
# Minutentakt, ohne Code. Fehlt ein Schluessel, gilt der Default im Modul.
#
# Jede Regel meldet EINMAL beim Ausloesen und EINMAL bei der Entwarnung
# (Tabelle ops_alerts merkt sich den Zustand) — dazwischen ist Ruhe.

# Platten
disk_free_pct_min: 10          # jeder eingehaengte Datentraeger
disk_free_pct_min_system: 20   # "/" (System + Postgres): schon bei 80 % voll warnen
# Aus den Datenblaettern der verbauten Laufwerke (geprueft 2026-09-16), nicht
# aus dem Bauch. HDD: Seagate Barracuda ST2000DM008, Betrieb 0-60 °C -> Warnung
# bei 55. SSD/NVMe: Kingston NV2, Lexar NM790 und Kingston A400 sind alle
# 0-70 °C spezifiziert -> Warnung bei 68. Die 65 davor lagen unter dem, was ein
# DRAM-loses NVMe unter Dauerlast normal erreicht; der Alarm vom 16.09. kam bei
# 65,8 °C, waehrend das Laufwerk selbst nie gewarnt hatte.
# Der eigentliche Waechter ist warning_temp_time/critical_comp_time: steigt die
# Zeit, die ein Laufwerk ueber SEINER eigenen Schwelle verbringt, gibt es Alarm,
# ganz ohne diese Zahlen (Regel disk_smart).
disk_temp_hdd_max_c: 55
disk_temp_ssd_max_c: 68
# NVMe-Warmzeit: Alarm erst ab so vielen Minuten ueber der EIGENEN Warnschwelle der Platte in 24 h
# (seit 09.10., Owner: vorher meldete jede einzelne Minute). Gemessen 0-6 min/Tag normal, 13-26 an
# Tagen mit schwerer Schreiblast; die kritische Zeit (critical_comp_time) bleibt ein Sofort-Alarm.
nvme_warning_temp_min_per_day: 30
nvme_wear_pct_max: 90
nvme_spare_pct_min: 10
# HDD-Sektorzaehler und NVMe-Medienfehler: Alarm nur, wenn sie STEIGEN
# (gegenueber der vorigen vollen Messung) — ein seit Jahren stabiler Wert ist keiner.

# GPU lokal
gpu_temp_max_c: 88
gpu_foreign_vram_mib: 1500     # mehr belegt, aber kein llama-server antwortet und kein Job haelt die Karte (Ruhezustand mit 8B = kein Alarm)

# Postgres
db_connections_pct_max: 80

# Laeufe (ops_events)
job_slow_factor: 2.0           # laeuft noch und schon laenger als Faktor x Median (28 Tage, >= 3 Laeufe)
job_hang_hours: 6              # laeuft noch, seit mehr als N Stunden

# Rueckstand
backlog_growth_days: 3         # Tagesmaximum des Backlogs steigt N Tage in Folge

# Sampler selbst — prueft der Morgen-Waechter (scripts/cycle_watchdog.py), nicht der Sampler
sampler_stale_min: 5

# Fehlgeschlagene Laeufe (ops_events): der letzte ABGESCHLOSSENE Lauf eines Jobs
# endete mit rc != 0. Der Alarm bleibt, bis derselbe Job wieder mit rc=0 endet.
# Anlass 2026-09-26: discovery_loop meldete drei Sonntage in Folge rc=1 (der
# Retrain der Distill-Heads wurde bei 56 GB OOM-getoetet) — die Zeile stand in
# ops_events, aber keine Regel las sie.
job_failed_lookback_days: 14
job_failed_ignore_rc: [75]     # 75 = Skip des GPU-Kollisionswaechters, kein Defekt
