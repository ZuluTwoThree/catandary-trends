# ---------------------------------------------------------------------------
# Funding APIs (public research/innovation grants — early foresight signal).
#
# NOT polled as RSS. These are pulled by scripts/ingest_funding.py, which
# registers a real source row per API (source_type='api', vertical='CROSS')
# via db.upsert_source and inserts each award as a dated raw_entry. This block
# is documentation/registry only — the feed_poller iterates `verticals` and
# `cross_industry`, never `funding_apis`, so listing the API URLs here can't
# break polling. Each entry captures WHAT is concretely funded (project title +
# objective/abstract) plus funder, country/region (hotspot clustering) and amount.
#
#   python scripts/ingest_funding.py --backend all  --since 2024-01-01   # nsf+nih+openaire
#   python scripts/ingest_funding.py --backend ukri --since 2024-01-01   # opt-in
funding_apis:
- name: NSF Awards (US Federal Research Funding)
  feed_url: https://api.nsf.gov/services/v1/awards.json
  backend: nsf
  scope: US federal research; abstractText + awardee state + obligated amount
- name: NIH RePORTER (US Biomedical Funding)
  feed_url: https://api.reporter.nih.gov/v2/projects/search
  backend: nih
  scope: US biomedical; abstract_text + org state/country + award amount
- name: OpenAIRE Projects (EU + National Funders)
  feed_url: https://api.openaire.eu/search/projects
  backend: openaire
  scope: EU (Horizon Europe/CORDIS) + national funders of many countries;
    summary + funder + jurisdiction(country) + funded amount. The "all countries /
    tech-hotspot" backbone — sharded by strategic technology keywords.
- name: UKRI Gateway to Research (UK)
  feed_url: https://gtr.ukri.org/gtr/api/projects
  backend: ukri
  scope: UK research & innovation; abstractText + lead funder. Opt-in (no
    server-side date filter — client-filtered by project start year).
