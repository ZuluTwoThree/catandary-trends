# ---------------------------------------------------------------------------
# Quellen-Registry (RSS/Atom). Kriterien fuer jede Quelle seit 2026-09-03 (#97, Owner):
#   1. Valider RSS/Atom-Feed einer Primaerquelle (Fachmedium, Newsroom, Institution,
#      Presseverteiler). Aggregatoren nie als Quelle - als Entdeckungs-Index erlaubt.
#   2. robots.txt erlaubt CatandaryTrendsBot (bzw. *) Feed-URL und Artikelseite;
#      die Artikelseite antwortet dem Bot-UA mit 200 (kein Browser-Spoof; 401/403/429
#      = blocked).
#   3. Kein maschinenlesbarer TDM-Vorbehalt (§44b Abs. 3 UrhG): TDM-Reservation-Header,
#      <meta name="tdm-reservation">, noai/noimageai, /.well-known/tdmrep.json.
#   4. fulltext: true nur ohne Vorbehalt/Sperre, bevorzugt bei offener Lizenz (CC BY,
#      CC0, OGL, Public Domain); sonst Titel/Teaser aus dem Feed (fulltext: false).
#
# Protokollfelder je Quelle - geschrieben von scripts/probe_source_compliance.py
# (--all-active --write) und monatlich von scripts/monthly_source_check.py (Abschnitt 8):
#   tdm_checked: "YYYY-MM-DD"  Datum der letzten Pruefung
#   tdm_status:  ok | reserved | blocked | feed_error   (Kommentar = Begruendung).
#                reserved = TDM-Vorbehalt auf Artikel oder Feed; blocked = Bot-Sperre
#                oder robots-Verbot (auch wenn die Regel nur die Feed-URL trifft - dann
#                bleibt fulltext bestehen, der Owner entscheidet); feed_error = nicht
#                verifizierbar (Feed defekt, Artikel Timeout/5xx).
#   license:     Kurzform, nur wenn strukturiert erkannt (link rel=license, CC-URL,
#                Feed-Lizenzelement) - Textfunde erscheinen nur im Werkzeug als Hinweis.
#   discovered_via: Index der Kandidatenrecherche (hn, wikipedia, idw, reddit).
# fulltext: true wird bei reserved/blocked auf Artikel-Ebene automatisch auf false
# gesetzt (Datums-Kommentar) und nie automatisch wieder eingeschaltet.
#
# Werkzeuge: scripts/probe_source_compliance.py (Kandidaten, --file, --all-active),
# scripts/discover_from_aggregators.py (HN-/Wikipedia-/idw-/Reddit-Index -> Kandidaten
# -> --probe). Doku: docs/compliance/source_probe_2026-09-04.md,
# docs/compliance/tdm_probe_2026-09-03.md. Kontakt Quellenrecherche: sources@catandary.de
# ---------------------------------------------------------------------------
